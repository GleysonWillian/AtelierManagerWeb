spring.application.name=atelier-manager-web

# Conexão com SQL Server
spring.datasource.url=jdbc:sqlserver://Note-Dev:1433;databaseName=AtelierManager;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Credenciais por variáveis de ambiente
spring.datasource.username=${ATELIER_DB_USER}
spring.datasource.password=${ATELIER_DB_PASSWORD}

# Configurações JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE